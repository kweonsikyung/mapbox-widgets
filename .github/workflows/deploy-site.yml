name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install

      - name: Build library
        run: pnpm build

      - name: Install site dependencies
        run: pnpm install
        working-directory: site

      - name: Sync local dist into site
        run: |
          mkdir -p site/node_modules/mapbox-gl-kit/dist
          cp -r dist/. site/node_modules/mapbox-gl-kit/dist/
          cp package.json site/node_modules/mapbox-gl-kit/package.json

      - name: Build site
        run: pnpm vite build
        working-directory: site
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
